<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <radialGradient id="piece" cx="0.4" cy="0.35" r="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f0f0f0"/>
      <stop offset="0.75" stop-color="#dcdcdc"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </radialGradient>
    <radialGradient id="ring" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>

  <!-- Fundo com gradiente -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Halo sutil -->
  <circle cx="256" cy="256" r="190" fill="rgba(255,255,255,0.08)"/>

  <!-- Peça de damas -->
  <circle cx="256" cy="256" r="150" fill="url(#piece)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#333" stroke-width="10"/>

  <!-- Anel interno -->
  <circle cx="256" cy="256" r="118" fill="none" stroke="#5a5a5a" stroke-width="14"/>
  <circle cx="256" cy="256" r="104" fill="none" stroke="#8a8a8a" stroke-width="4"/>

  <!-- Coroa central -->
  <circle cx="256" cy="256" r="52" fill="url(#ring)"/>
  <text x="256" y="278" font-family="Arial, sans-serif" font-size="64" font-weight="bold"
        text-anchor="middle" fill="#ffd977">♛</text>

  <!-- Brilho superior -->
  <ellipse cx="218" cy="180" rx="46" ry="26" fill="rgba(255,255,255,0.35)" transform="rotate(-28 218 180)"/>
</svg>
